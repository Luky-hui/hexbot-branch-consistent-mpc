    coxa_axis: [0.0, 0.0, 1.0]
    femur_axis: [0.0, 0.0, -1.0]
    tarsus_axis: [0.0, 0.0, 1.0]
  LM:
    mount_xyz: [0.0, 0.072, 0.0]
    mount_rpy: [0.0, 0.0, 1.5707963267948966]
    coxa_axis: [0.0, 0.0, 1.0]
    femur_axis: [0.0, 0.0, -1.0]
    tarsus_axis: [0.0, 0.0, 1.0]
  LF:
    mount_xyz: [0.106, 0.06, 0.0]
