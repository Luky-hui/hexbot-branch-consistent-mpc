robot_name: hexbot
leg_order:
  - RR
  - RM
  - RF
  - LR
  - LM
  - LF

controller:
  publish_rate_hz: 50.0
  joint_command_topic: /joint_command
  joint_state_topic: /joint_states
  cmd_vel_topic: /cmd_vel
  imu_topic: /imu
  odom_frame: odom
  base_frame: base_link
  imu_frame: imu_link
  enable_debug_topics: true
  cmd_vel_timeout_sec: 0.5
  cmd_vel_linear_deadband: 0.002
  cmd_vel_angular_deadband: 0.02
  cmd_filter_tau_sec: 0.18
  cmd_accel_limit_x: 1.0
  cmd_accel_limit_y: 0.5
  cmd_accel_limit_yaw: 1.2
  seed_timeout_sec: 1.5
  reject_seed_if_near_zero: true
  zero_seed_threshold_rad: 0.02
  locomotion_startup_mode: fixed_stand
  startup_joint_tolerance_rad: 0.25
  recovery_complete_joint_tolerance_rad: 0.10
  stand_recovery_timeout_sec: 2.0
  default_mode: tripod
  tripod_max_joint_delta_rad: 0.18
  tripod_ik_reject_error_norm: 0.02
  seed_from_joint_states: true
  reset_to_stand_on_shutdown: true

imu_estimator:
  imu_timeout_sec: 0.25
  imu_orientation_alpha: 0.15
  imu_angular_velocity_alpha: 0.2
  imu_roll_offset_rad: 0.0
  imu_pitch_offset_rad: 0.0
  imu_gravity_min_mps2: 7.0
  imu_gravity_max_mps2: 12.5
  imu_fail_open: true

stabilizer:
  enable_imu_stabilizer: true
  stabilizer_deadband_rad: 0.02
  stabilizer_activation_rad: 0.03
  stabilizer_roll_kp: 0.22
  stabilizer_roll_kd: 0.035
  stabilizer_pitch_kp: 0.25
  stabilizer_pitch_kd: 0.04
  stabilizer_stand_scale: 0.35
  stabilizer_walk_scale: 0.0
  stabilizer_max_roll_correction_rad: 0.08
  stabilizer_max_pitch_correction_rad: 0.08
  stabilizer_max_correction_rate_rad_s: 0.35

ik:
  max_iterations: 60
  tolerance: 1.0e-4
  damping: 5.0e-3
  finite_difference_step: 1.0e-5
  max_delta_per_iteration: 0.25
  joint_lower_limit: -3.14
  joint_upper_limit: 3.14
  joint_lower_limits: [-1.05, -1.0, -1.35]
  joint_upper_limits: [1.05, 1.0, 1.35]

gait:
  # Current explicit stance candidate selected from fresh-start A/B.
  cycle_length: 8
  leg_lift_height: 0.03
  nominal_step_length: 0.02
  tripod_base_cadence_hz: 1.4
  tripod_max_cadence_hz: 2.4
  tripod_max_linear_x: 0.15
  tripod_max_linear_y: 0.08
  tripod_max_angular_z: 0.6
  tripod_forward_stride_m: 0.07
  tripod_lateral_stride_m: 0.02
  tripod_turn_stride_m: 0.07
  tripod_turn_gain: 1.0
  tripod_turn_input_exponent: 0.8
  tripod_turn_cadence_boost_hz: 0.4
  tripod_lateral_gain: 0.6
  tripod_stop_cadence_hz: 1.6
  tripod_groups:
    A: [RR, RF, LM]
    B: [RM, LR, LF]

stance:
  # 15% interpolation from the explicit baseline footprint toward the wider
  # mid-stance x/y targets. z stays at the explicit baseline values.
  per_leg_stance_positions:
    RR: {x: -0.17695408, y: -0.17577639, z: -0.12771602}
    RM: {x: -0.00020381, y: -0.20807331, z: -0.12524361}
    RF: {x: 0.17659909, y: -0.17569885, z: -0.12307657}
    LR: {x: -0.17709732, y: 0.17490272, z: -0.12949832}
    LM: {x: -0.00024808, y: 0.20735814, z: -0.12733633}
    LF: {x: 0.17660790, y: 0.17486246, z: -0.12486010}

neutral_joint_positions:
  RR: [0.001, -0.1308, 0.1414]
  RM: [-0.0017, -0.1672, 0.1817]
  RF: [-0.0032, -0.199, 0.2159]
  LR: [0.0035, 0.1043, -0.1188]
  LM: [0.002, 0.1362, -0.1551]
  LF: [-0.0003, 0.1726, -0.1948]

links:
  coxa_to_femur:
    xyz: [0.06551, 0.0, 0.0]
    rpy: [-1.5707963267948966, 1.5707963267948966, 0.0]
  femur_to_tarsus:
    xyz: [0.01817, -0.0658, 0.0]
    rpy: [3.141592653589793, 0.0, 0.0]
  tarsus_to_foot:
    xyz: [0.11829, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

legacy_reference:
